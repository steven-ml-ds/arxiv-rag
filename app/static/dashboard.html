<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arxiv-rag dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    .metrics { display: flex; gap: 1.5rem; margin: 1rem 0; }
    .metric { background: #f4f4f5; padding: .75rem 1rem; border-radius: .5rem; }
    .metric b { display: block; font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>arxiv-rag dashboard</h1>
  <h2>Eval results</h2>
  <div id="eval" class="metrics">loading…</div>
  <h2>Recent queries</h2>
  <table id="queries"><thead><tr>
    <th>question</th><th>rewritten</th><th>latency (ms)</th><th>out tokens</th>
  </tr></thead><tbody></tbody></table>
  <script>
    async function load() {
      const r = await fetch("/api/stats");
      const data = await r.json();
      const e = document.getElementById("eval");
      if (data.eval) {
        e.innerHTML = `
          <div class="metric">hit@5<b>${data.eval.hit_at_5.toFixed(2)}</b></div>
          <div class="metric">citation acc<b>${data.eval.citation_accuracy.toFixed(2)}</b></div>
          <div class="metric">avg latency<b>${Math.round(data.eval.avg_latency_ms)} ms</b></div>
          <div class="metric">n<b>${data.eval.n}</b></div>`;
      } else {
        e.textContent = "No eval results yet — run `python eval/run_eval.py`.";
      }
      const tb = document.querySelector("#queries tbody");
      tb.innerHTML = "";
      for (const q of data.queries) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${q.question}</td><td>${q.rewritten}</td>` +
          `<td>${Math.round(q.latency_ms)}</td><td>${q.output_tokens ?? ""}</td>`;
        tb.appendChild(tr);
      }
    }
    load();
  </script>
</body>
</html>
