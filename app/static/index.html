<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arxiv-rag</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    #log { white-space: pre-wrap; }
    .turn { margin: 1rem 0; }
    .user { color: #2563eb; }
    .assistant { color: #111; }
    .sources { font-size: 0.85rem; color: #666; margin-top: .25rem; }
    #row { display: flex; gap: .5rem; }
    #q { flex: 1; padding: .5rem; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>arxiv-rag</h1>
  <div id="log"></div>
  <div id="row">
    <input id="q" placeholder="Ask about an AI/ML paper..." autofocus />
    <button id="send">Send</button>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("q");
    const send = document.getElementById("send");
    const history = [];

    function add(role, text) {
      const div = document.createElement("div");
      div.className = "turn " + role;
      div.textContent = (role === "user" ? "You: " : "Assistant: ") + text;
      log.appendChild(div);
      return div;
    }

    async function ask() {
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      add("user", q);
      const out = add("assistant", "");
      let answer = "";

      const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q, history }),
      });
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const events = buf.split("\n\n");
        buf = events.pop();
        for (const ev of events) {
          const line = ev.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const data = JSON.parse(line.slice(6));
          if (ev.includes("event: token")) {
            answer += data.text;
            out.textContent = "Assistant: " + answer;
          } else if (ev.includes("event: sources")) {
            const ids = data.sources.map((s) => s.arxiv_id).join(", ");
            const s = document.createElement("div");
            s.className = "sources";
            s.textContent = "Sources: " + ids;
            out.appendChild(s);
          }
        }
      }
      history.push({ role: "user", content: q });
      history.push({ role: "assistant", content: answer });
    }

    send.onclick = ask;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  </script>
</body>
</html>
